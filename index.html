<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demain · P'tit Belliveau</title>
<style>
  :root { --fg: #f2f2f2; --muted: #a0a0a0; --accent: #fdc800; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; background: #000; }
  #stage.idle { cursor: none; }

  #screen { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block;
            width: min(100vw, calc(100vh * 16 / 9)); width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9; }

  /* The sound and the clock come from YouTube, so its player stays visible */
  #pip { position: absolute; top: 16px; right: 16px; width: 160px; height: 90px; background: #000;
         box-shadow: 0 8px 30px rgba(0, 0, 0, .6); outline: 1px solid rgba(255, 255, 255, .15); }
  #pip iframe { display: block; width: 100%; height: 100%; border: 0; }

  #controls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px;
              padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
              background: linear-gradient(transparent, rgba(0, 0, 0, .75)); transition: opacity .3s; }
  #stage.idle #controls { opacity: 0; pointer-events: none; }
  button { flex: none; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 6px;
           background: none; color: var(--fg); cursor: pointer; font: inherit; }
  button:hover, button:focus-visible { background: rgba(255, 255, 255, .14); outline: none; }
  button:disabled { opacity: .35; cursor: default; background: none; }
  button svg { width: 26px; height: 26px; fill: currentColor; }
  #seek { flex: 1; min-width: 60px; accent-color: var(--accent); cursor: pointer; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  #cc[aria-pressed="false"] { color: var(--muted); }

  /* Current lyric line, just above the controls */
  #lyric { position: absolute; left: 16px; right: 16px; bottom: 84px; display: flex; justify-content: center;
           text-align: center; pointer-events: none; }
  #lyric span { max-width: 100%; padding: .12em .5em; border-radius: 4px; background: rgba(0, 0, 0, .8); color: #fff;
                font-weight: 700; font-size: clamp(16px, 2.4vw, 42px); line-height: 1.35;
                -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #lyric span:empty { display: none; }

  /* Credit for the clip, fades out with the controls */
  #credit { position: absolute; top: 16px; left: 16px; padding: 8px 12px; border-radius: 6px; background: rgba(0, 0, 0, .7);
            color: var(--fg); font-size: 13px; line-height: 1.35; text-decoration: none; transition: opacity .3s; }
  #credit:hover b { text-decoration: underline; }
  #stage.idle #credit { opacity: 0; pointer-events: none; }

  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(90vw, 520px);
         padding: 14px 18px; border-radius: 8px; background: rgba(0, 0, 0, .85); line-height: 1.5; text-align: center; }
  #msg:empty { display: none; }
  code { background: rgba(255, 255, 255, .1); padding: 1px 5px; border-radius: 4px; }

  /* Phones held upright: blocks on top, the YouTube player under them */
  @media (max-aspect-ratio: 1/1) {
    #screen { top: 0; transform: translateX(-50%); }
    #pip { top: calc(100vw * 9 / 16 + 16px); right: auto; left: 50%; transform: translateX(-50%); }
    #lyric { bottom: auto; top: calc(100vw * 9 / 16 + 122px); }
    #lyric span { font-size: clamp(16px, 5vw, 26px); }
    #time { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen"></canvas>
  <div id="pip"><div id="yt"></div></div>
  <div id="lyric"><span></span></div>
  <a id="credit" href="https://www.youtube.com/watch?v=IKg3dsc90-A" target="_blank" rel="noopener"><b>Demain</b> by P'tit Belliveau</a>
  <div id="controls">
    <button id="play" disabled aria-label="Play" title="Play (space)">
      <svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
    </button>
    <input id="seek" type="range" min="0" max="0" step="any" value="0" aria-label="Seek">
    <span id="time">0:00 / 0:00</span>
    <button id="cc" aria-label="Lyrics" aria-pressed="true" disabled title="Looking for lyrics on LRCLIB">
      <svg viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1z"/></svg>
    </button>
    <button id="full" aria-label="Fullscreen" title="Fullscreen (f)">
      <svg viewBox="0 0 24 24"><path id="full-icon"/></svg>
    </button>
  </div>
  <div id="msg">Loading…</div>
</div>
<script src="replay.js"></script>
<script>
const params = new URLSearchParams(location.search);
const VIDEO = params.get('v') || 'IKg3dsc90-A';
const SRC = params.get('src') || 'events.bin';
const ARTIST = params.get('artist') || "P'tit Belliveau";
const TRACK = params.get('track') || 'Demain';
// LRCLIB's timing lands a bit late on this video, and a line reads better
// when it shows up just before it's sung anyway, so lines go up this early
const LYRICS_LEAD = 0.75;
const IDLE_MS = 2500;
// A jump bigger than this is a seek, anything smaller is clock jitter
const JITTER = 0.3;
const ICONS = {
  play: 'M8 5v14l11-7z',
  pause: 'M6 5h4v14H6zm8 0h4v14h-4z',
  full: 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z',
  unfull: 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z',
};

const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('screen'), ctx = canvas.getContext('2d');
const playBtn = $('play'), seek = $('seek'), timeEl = $('time'), fullBtn = $('full'), msg = $('msg');
const ccBtn = $('cc'), lyricEl = document.querySelector('#lyric span');

// The YouTube embed, where the sound and the clock come from
let source = null;
let clip = null, cursor = null;
let shown = 0, lastRaw = -1, rawAt = 0, pending = null;
let dirty = true, dragging = false;
let lyrics = [], lyricIndex = -2, showLyrics = true;

function say(html) { msg.innerHTML = html; }

function fmt(t) {
  t = Math.max(0, Math.floor(t));
  return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
}

// The embed only reports its time a few times a second on some versions,
// so run forward from the last fresh reading and ignore tiny steps back.
function clock(now) {
  if (!source) return 0;
  const raw = source.time(), playing = source.playing();
  if (pending) {
    // After our own seek YouTube reports the old time for a beat, and while
    // paused it doesn't report the new spot at all until play resumes, so
    // hold our target and only start the timeout once it's playing
    if (!playing) pending.until = now + 1500;
    if (Math.abs(raw - pending.t) > 0.25 && now < pending.until) return pending.t;
    pending = null;
  }
  if (raw !== lastRaw) { lastRaw = raw; rawAt = now; }
  if (!playing) return (shown = raw);
  let t = raw + Math.min((now - rawAt) / 1000, 1) * source.rate();
  if (t < shown && shown - t < JITTER) t = shown;
  return (shown = t);
}

function tick(now) {
  requestAnimationFrame(tick);
  if (!clip) return;
  const t = dragging ? +seek.value : clock(now);
  const moved = cursor.seek(t * clip.fps);
  if (moved || dirty) {
    Replay.draw(ctx, clip, cursor.grid);
    dirty = false;
  }
  const li = showLyrics ? lyricAt(t + LYRICS_LEAD) : -1;
  if (li !== lyricIndex) {
    lyricIndex = li;
    lyricEl.textContent = li >= 0 ? lyrics[li].text : '';
  }
  if (!dragging) seek.value = t;
  const label = `${fmt(t)} / ${fmt(clip.duration)}`;
  if (timeEl.textContent !== label) timeEl.textContent = label;
}

function toggle() {
  if (!source) return;
  if (source.busy()) source.pause();
  else source.play();
}

function seekTo(t) {
  if (!clip) return;
  t = Math.max(0, Math.min(clip.duration, t));
  pending = { t, until: performance.now() + 1500 };
  shown = t;
  seek.value = t;
  if (source) source.seek(t);
}

// LRC lines look like "[01:23.45] words", a line can carry several stamps,
// and a stamp with no words is a gap where nothing should show
function parseLrc(text) {
  const lines = [];
  for (const raw of text.split(/\r?\n/)) {
    const stamps = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const words = raw.replace(/\[\d+:\d+(?:\.\d+)?\]/g, '').trim();
    for (const m of stamps) lines.push({ t: +m[1] * 60 + +m[2], text: words });
  }
  return lines.sort((a, b) => a.t - b.t);
}

// Index of the line being sung at time t, -1 before the first one
function lyricAt(t) {
  if (!lyrics.length) return -1;
  let lo = 0, hi = lyrics.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (lyrics[mid].t <= t) { found = mid; lo = mid + 1; } else hi = mid - 1;
  }
  // Every line holds until the next one, except the last shouldn't sit over the credits
  if (found === lyrics.length - 1 && t - lyrics[found].t > 6) return -1;
  return found;
}

function setLyrics(on) {
  showLyrics = on;
  ccBtn.setAttribute('aria-pressed', on);
  try { localStorage.setItem('replay-lyrics', on ? '1' : '0'); } catch {}
}

// Fullscreen goes on the whole stage so the YouTube player comes along
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFull() {
  if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
}
function onFullChange() {
  const on = !!fsElement();
  $('full-icon').setAttribute('d', on ? ICONS.unfull : ICONS.full);
  fullBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Fullscreen');
}
if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) fullBtn.hidden = true;
document.addEventListener('fullscreenchange', onFullChange);
document.addEventListener('webkitfullscreenchange', onFullChange);
onFullChange();

// Controls fade out while playing and come back on any mouse or key activity
let idleTimer = 0;
function wake() {
  stage.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (source && source.playing() && !dragging) stage.classList.add('idle');
  }, IDLE_MS);
}
['mousemove', 'pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, wake));

function onState() {
  const on = !!source && source.busy();
  $('play-icon').setAttribute('d', on ? ICONS.pause : ICONS.play);
  playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
  if (on && clip) say('');
  wake();
}

// Single click plays or pauses, double click goes fullscreen, like a video player
let clickTimer = 0;
canvas.addEventListener('click', () => { clearTimeout(clickTimer); clickTimer = setTimeout(toggle, 250); });
canvas.addEventListener('dblclick', () => { clearTimeout(clickTimer); if (!fullBtn.hidden) toggleFull(); });

playBtn.addEventListener('click', toggle);
fullBtn.addEventListener('click', toggleFull);
ccBtn.addEventListener('click', () => setLyrics(!showLyrics));
seek.addEventListener('input', () => { dragging = true; });
seek.addEventListener('change', () => { dragging = false; seekTo(+seek.value); });

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // Space on a focused button already clicks it
  if (e.code === 'Space' && e.target.closest('button')) return;
  const keys = {
    Space: toggle, KeyK: toggle,
    KeyF: () => { if (!fullBtn.hidden) toggleFull(); },
    KeyC: () => { if (!ccBtn.disabled) setLyrics(!showLyrics); },
    ArrowLeft: () => seekTo(shown - 5),
    ArrowRight: () => seekTo(shown + 5),
  };
  if (!keys[e.code]) return;
  e.preventDefault();
  keys[e.code]();
});

addEventListener('resize', () => { if (Replay.fitCanvas(canvas)) dirty = true; });
Replay.fitCanvas(canvas);
try { setLyrics(localStorage.getItem('replay-lyrics') !== '0'); } catch { setLyrics(true); }

// Lyrics come live from LRCLIB every time, nothing gets stored in the repo
fetch(`https://lrclib.net/api/search?${new URLSearchParams({ artist_name: ARTIST, track_name: TRACK })}`)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(hits => {
    const hit = hits.find(h => h.syncedLyrics);
    if (!hit) throw new Error('no synced lyrics');
    lyrics = parseLrc(hit.syncedLyrics);
    lyricIndex = -2;
    ccBtn.disabled = false;
    ccBtn.title = `Lyrics from LRCLIB, ${hit.artistName} · ${hit.trackName} (c)`;
  })
  .catch(() => { ccBtn.title = `No synced lyrics for ${TRACK} on LRCLIB`; });

fetch(SRC)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
  .then(buf => Replay.load(buf))
  .then(loaded => {
    clip = loaded;
    cursor = new Replay.Cursor(clip);
    seek.max = clip.duration;
    dirty = true;
    say(source ? '' : 'Waiting for YouTube…');
  })
  .catch(() => say(`No <code>${SRC}</code> here yet. Run <code>python3 extract.py work/clip_hd.mp4 events.bin</code>, then reload.`));

function useSource(s) {
  source = s;
  playBtn.disabled = false;
  if (clip) say('');
  onState();
}

const YT_ERRORS = {
  2: 'the video id looks wrong',
  5: 'the embedded player hit a playback error',
  100: 'the video is gone or private',
  101: 'the owner turned off embedding for this video',
  150: 'the owner turned off embedding for this video',
  153: "the player didn't get a referrer",
};
function useYouTube() {
  window.onYouTubeIframeAPIReady = () => {
    const yt = new YT.Player('yt', {
      width: '100%', height: '100%', videoId: VIDEO,
      playerVars: { playsinline: 1, rel: 0, origin: location.origin },
      events: {
        onReady: () => {
          const state = () => yt.getPlayerState();
          useSource({
            time: () => yt.getCurrentTime() || 0,
            playing: () => state() === YT.PlayerState.PLAYING,
            busy: () => state() === YT.PlayerState.PLAYING || state() === YT.PlayerState.BUFFERING,
            rate: () => yt.getPlaybackRate(),
            play: () => {
              yt.playVideo();
              // Some browsers only let the first play with sound come from inside the embed
              setTimeout(() => {
                if (state() === -1 || state() === YT.PlayerState.CUED) say('Your browser wants the first play to happen on the YouTube player. Hit play there once and the blocks follow.');
              }, 1500);
            },
            pause: () => yt.pauseVideo(),
            seek: t => yt.seekTo(t, true),
          });
        },
        onStateChange: onState,
        onError: e => {
          const why = YT_ERRORS[e.data] || `error ${e.data}`;
          const hint = location.protocol === 'file:'
            ? ' Serve the folder instead of opening the file, with <code>python3 -m http.server</code>.'
            : ' <a href="viewer.html" style="color:inherit">The viewer</a> still plays the blocks without sound.';
          say(`YouTube can't play here: ${why}.${hint}`);
        },
      },
    });
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = () => say('Couldn\'t reach YouTube, so there\'s no sound or clock. <a href="viewer.html" style="color:inherit">The viewer</a> plays the blocks silently.');
  document.head.append(tag);
}

useYouTube();

requestAnimationFrame(tick);
</script>
</body>
</html>
